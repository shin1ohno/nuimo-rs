[package]
name = "nuimo"
version = "0.1.1"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Rust SDK for Senic Nuimo Control BLE smart knob — discovery, rotation, touch, swipe, and LED matrix"
repository = "https://github.com/shin1ohno/nuimo-rs"
homepage = "https://github.com/shin1ohno/nuimo-rs"
keywords = ["nuimo", "ble", "bluetooth", "sdk", "senic"]
categories = ["hardware-support", "api-bindings"]
readme = "../../README.md"

[dependencies]
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = "0.1"
tracing = { workspace = true }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17", features = ["full"] }

[target.'cfg(target_os = "macos")'.dependencies]
btleplug = "0.12"
futures = "0.3"

[dev-dependencies]
anyhow = "1"
tracing-subscriber = { workspace = true }
