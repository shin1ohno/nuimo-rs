name: Release binaries

on:
  push:
    tags:
      - 'nuimo-mqtt-v*'

permissions: {}

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      # softprops/action-gh-release creates the release and uploads assets.
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_suffix: linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_suffix: macos-aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      # No build cache in this job: a cache written by a PR build must not
      # flow into a released binary.
      - name: Install Linux BLE deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Build release binary
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --package nuimo-mqtt --target "$TARGET"

      - name: Package
        id: package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARCHIVE_SUFFIX: ${{ matrix.archive_suffix }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          name="nuimo-mqtt-${tag#nuimo-mqtt-v}-${ARCHIVE_SUFFIX}"
          mkdir -p "dist/${name}"
          cp "target/${TARGET}/release/nuimo-mqtt" "dist/${name}/"
          cp LICENSE-MIT LICENSE-APACHE README.md "dist/${name}/"
          tar -czf "dist/${name}.tar.gz" -C dist "${name}"
          (cd dist && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256")
          echo "archive=dist/${name}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "sha256=dist/${name}.tar.gz.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.sha256 }}
          fail_on_unmatched_files: true
